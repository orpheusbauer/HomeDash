name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/orpheusbauer/homedash:${{ github.ref_name }}
            ghcr.io/orpheusbauer/homedash:latest
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle -p apps/android assembleDebug
      - name: Build signed release descriptor
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq -n --arg version "$VERSION" --arg image "ghcr.io/orpheusbauer/homedash" --arg digest "$IMAGE_DIGEST" --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{version:$version,image:$image,digest:$digest,createdAt:$createdAt}' > homedash-release.json
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "homedash-kiosk-${VERSION}-debug.apk"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" homedash-release.json homedash-kiosk-*-debug.apk --generate-notes --verify-tag
