name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run release:check
      - run: npm run build
      - name: Build Raspberry Pi Zero native archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(cat VERSION)" = "$VERSION"
          bash deployment/raspberry-pi-zero/package-native.sh "$VERSION" "$RUNNER_TEMP/native-release"
          cp "$RUNNER_TEMP/native-release/"* .
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2
      - name: Prepare Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.HOMEDASH_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HOMEDASH_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HOMEDASH_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HOMEDASH_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/homedash-release.jks"
      - name: Build signed Android release
        env:
          HOMEDASH_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/homedash-release.jks
          HOMEDASH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HOMEDASH_ANDROID_KEYSTORE_PASSWORD }}
          HOMEDASH_ANDROID_KEY_ALIAS: ${{ secrets.HOMEDASH_ANDROID_KEY_ALIAS }}
          HOMEDASH_ANDROID_KEY_PASSWORD: ${{ secrets.HOMEDASH_ANDROID_KEY_PASSWORD }}
        run: gradle -p apps/android assembleRelease
      - name: Prepare release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp apps/android/app/build/outputs/apk/release/app-release.apk "homedash-kiosk-${VERSION}.apk"
          sha256sum "homedash-kiosk-${VERSION}.apk" > "homedash-kiosk-${VERSION}.apk.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s|](\.\./|](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/|g" "docs/releases/${VERSION}.md" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" homedash-native-*.tar.gz homedash-native-*.sha256 homedash-kiosk-*.apk homedash-kiosk-*.apk.sha256 --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
