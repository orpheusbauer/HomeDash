name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Build Raspberry Pi Zero native archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash deployment/raspberry-pi-zero/package-native.sh "$VERSION" "$RUNNER_TEMP/native-release"
          cp "$RUNNER_TEMP/native-release/"* .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle -p apps/android assembleDebug
      - name: Prepare release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "homedash-kiosk-${VERSION}-debug.apk"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" homedash-native-*.tar.gz homedash-native-*.sha256 homedash-kiosk-*-debug.apk --generate-notes --verify-tag
