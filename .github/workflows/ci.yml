name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run audit:public
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify Raspberry Pi deployment safeguards
        run: bash deployment/raspberry-pi-zero/test-deployment.sh
      - name: Verify native release packaging
        run: |
          bash deployment/raspberry-pi-zero/package-native.sh 0.0.0 "$RUNNER_TEMP/native-package"
          mkdir "$RUNNER_TEMP/native-smoke"
          tar -xzf "$RUNNER_TEMP/native-package/homedash-native-0.0.0.tar.gz" -C "$RUNNER_TEMP/native-smoke"
          cd "$RUNNER_TEMP/native-smoke"
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund --workspace @homedash/server
          node -e "import('./apps/server/dist/app.js').then(({ createApp }) => createApp()).then(app => app.close())"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle -p apps/android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: homedash-kiosk-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
