server {
    listen 80;
    server_name __HOMEDASH_HOSTNAME__ __HOMEDASH_IP_ADDRESS__;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name __HOMEDASH_HOSTNAME__ __HOMEDASH_IP_ADDRESS__;

    ssl_certificate /etc/homedash/tls/homedash.crt;
    ssl_certificate_key /etc/homedash/tls/homedash.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HOMEDASH:2m;
    ssl_session_timeout 1h;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
    }
}

# Accès HTTP très limité pour l'exemple ESP32 existant. Le port 4100 externe
# n'expose que l'ingestion capteur; l'API d'administration reste inaccessible.
server {
    listen __HOMEDASH_IP_ADDRESS__:4100;
    server_name __HOMEDASH_IP_ADDRESS__;

    location = /api/v1/sensors/ingest {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 403;
    }
}
